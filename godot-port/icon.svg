<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="128" height="128" fill="#1e1e1e"/>
  
  <!-- Grid pattern -->
  <g opacity="0.3">
    <line x1="0" y1="32" x2="128" y2="32" stroke="#888" stroke-width="1"/>
    <line x1="0" y1="64" x2="128" y2="64" stroke="#888" stroke-width="1"/>
    <line x1="0" y1="96" x2="128" y2="96" stroke="#888" stroke-width="1"/>
    <line x1="32" y1="0" x2="32" y2="128" stroke="#888" stroke-width="1"/>
    <line x1="64" y1="0" x2="64" y2="128" stroke="#888" stroke-width="1"/>
    <line x1="96" y1="0" x2="96" y2="128" stroke="#888" stroke-width="1"/>
  </g>
  
  <!-- Stylized "FE" for Famidash Editor -->
  <text x="64" y="80" font-family="monospace" font-size="48" font-weight="bold" fill="#4a9eff" text-anchor="middle">FE</text>
  
  <!-- Pixel art accent -->
  <rect x="20" y="100" width="16" height="16" fill="#ff6b6b"/>
  <rect x="36" y="100" width="16" height="16" fill="#4ecdc4"/>
  <rect x="76" y="100" width="16" height="16" fill="#ffe66d"/>
  <rect x="92" y="100" width="16" height="16" fill="#95e1d3"/>
</svg>
